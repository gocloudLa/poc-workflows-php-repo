name: "Create Release"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to create release for (e.g., v1.2.0)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string
        default: ''
      target_repository:
        description: 'ArgoCD repository to update (owner/repo)'
        required: false
        type: string
        default: 'gocloudLa/poc-workflows-argocd-shared'
      target_branch:
        description: 'Target branch to update in ArgoCD repo'
        required: false
        type: string
        default: 'main'
      values_dir:
        description: 'Values folder inside ArgoCD repo'
        required: false
        type: string
        default: 'poc-workflows-php-repo'

permissions:
  contents: write

jobs:
  create-release:
    uses: gocloudLa/poc-workflows-shared/.github/workflows/create-release.yml@main
    with:
      tag_name: ${{ inputs.tag_name }}
      release_notes: ${{ inputs.release_notes }}
      target_repository: ${{ inputs.target_repository }}
      target_branch: ${{ inputs.target_branch }}
      values_dir: ${{ inputs.values_dir }}
    secrets: inherit
